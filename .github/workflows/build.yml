name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26 (matches local build env)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Android SDK (PATH config, skip built-in license accept)
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept SDK licenses + install 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 || true
          echo "SDK ready: $(ls $ANDROID_HOME/platforms 2>/dev/null | tr '\n' ' ')"

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicHapticsX-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: build-${{ github.sha }}
          name: MusicHapticsX v4.2 (${{ github.sha }}
          body: |
            MusicHapticsX v4.2 — 纯 libxposed API 102 重写

            推荐参数：震动模式「鼓点」+ 震动阈值 0.7
          draft: false
          prerelease: false
