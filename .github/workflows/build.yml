name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # NOTE: android-actions/setup-android@v3 is intentionally NOT used here.
      # It runs `sdkmanager tools`, but the legacy "tools" package has been
      # removed from the Google SDK repository, so that action now aborts with
      # exit code 1 on current runner images. The ubuntu-latest image already
      # ships a complete Android SDK, so we only install the extra packages.
      - name: Locate Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            for candidate in "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -n "$candidate" ] && [ -d "$candidate" ]; then
                export ANDROID_HOME="$candidate"
                break
              fi
            done
          fi
          if [ -z "$ANDROID_HOME" ]; then
            echo "No Android SDK found" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Install NDK, Build-Tools and CMake
        run: |
          SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            ls -la "$ANDROID_HOME" >&2
            exit 1
          fi
          echo "using $SDKMGR"
          yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --install \
            "ndk;27.0.12077973" "build-tools;35.0.0" "cmake;3.22.1" "platforms;android-35"

      - name: Repository checks
        run: python3 scripts/repo_check.py

      - name: Restore release signing key
        # The keystore is stored as the repository secret MHX_KEYSTORE_B64 so
        # that every release is signed with the same key. Without it each run
        # used a freshly generated debug key, which produced a different
        # signature per build and made Android refuse to install over the
        # already installed app. Fork pull requests cannot read secrets, so the
        # step is allowed to skip and the build then falls back to debug signing.
        run: |
          if [ -z "${MHX_KEYSTORE_B64:-}" ]; then
            echo "MHX_KEYSTORE_B64 is not available (fork PR or secret missing)."
            echo "Continuing with debug signing for this build."
            exit 0
          fi
          KEYSTORE_PATH="$GITHUB_WORKSPACE/mhx-release.jks"
          echo "$MHX_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "MHX_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Restored keystore: $(wc -c < "$KEYSTORE_PATH") bytes"
          # Print only non-sensitive facts so the log proves which key is in use.
          if [ -n "${MHX_KEY_ALIAS:-}" ]; then
            echo "key alias: $MHX_KEY_ALIAS"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4096m"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4096m"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: musichaptics-debug
          path: app/build/outputs/apk/debug/
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: musichaptics-release
          path: app/build/outputs/apk/release/
          retention-days: 30

      - name: Print Build Info
        if: success()
        run: |
          echo "Build Successful!"
          ls -lah app/build/outputs/apk/debug/ || true
          ls -lah app/build/outputs/apk/release/ || true