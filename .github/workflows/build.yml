name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install NDK
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4096m"
      
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4096m"
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: musichaptics-debug
          path: app/build/outputs/apk/debug/
          retention-days: 30
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: musichaptics-release
          path: app/build/outputs/apk/release/
          retention-days: 30
      
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
          retention-days: 7
      
      - name: Print Build Info
        if: success()
        run: |
          echo "✅ Build Successful!"
          echo "Debug APK: app/build/outputs/apk/debug/"
          echo "Release APK: app/build/outputs/apk/release/"
          ls -lah app/build/outputs/apk/debug/
          ls -lah app/build/outputs/apk/release/
